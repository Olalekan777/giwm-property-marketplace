<!DOCTYPE html><html><head><link rel="manifest" href="manifest.json"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb}.header{background:#0b5ed7;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #fff}.search{background:#fff;padding:10px;display:flex;gap:8px;position:sticky;top:68px;z-index:9;box-shadow:0 2px 6px rgba(0,0,0,.1)}.search input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px}.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer}.btn-p{background:#0b5ed7;color:#fff}.btn-g{background:#f3f4f6;border:1px solid #ddd}.container{padding:12px;max-width:900px;margin:auto}.form{background:#fff;padding:16px;border-radius:14px;display:none;margin-bottom:12px}.form input,.form select,.form textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.preview{width:100%;height:140px;display:none;object-fit:cover;border-radius:10px;border:1px dashed #ccc;background:#f3f4f6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);position:relative}.card img{width:100%;height:170px;object-fit:cover}.body{padding:10px}.price{color:#0b5ed7;font-weight:800}.title{font-weight:700;font-size:14px}.loc{font-size:12px;color:#666}.badge{position:absolute;top:8px;left:8px;background:#22c55e;color:#fff;font-size:10px;padding:5px 9px;border-radius:20px}.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;font-size:12px;font-weight:700}.wa{background:#0b5ed7;color:#fff;text-align:center;text-decoration:none;display:block;padding:9px;border-radius:9px;font-size:12px;font-weight:700;margin-top:8px}.footer{background:#111827;color:#9ca3af;padding:20px;margin-top:20px;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.mbox{background:#fff;padding:20px;border-radius:14px;width:100%;max-width:360px}.mbox input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:#f9fafb;font-weight:700}.tabs button.active{background:#0b5ed7;color:#fff}.userpill{background:rgba(255,255,255,.25);padding:5px 10px;border-radius:20px;font-size:12px}
</style></head><body>
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img src="logo.png" class="logo" onerror="this.style.display='none'"><div><h3 style="font-size:15px">GIWM MARKET PLACE</h3><small>Abuja's Trusted</small></div></div><div id="hUser"></div></div>
<div class="search"><input id="q" placeholder="Search Lugbe, Kuje..." oninput="render()"><button class="btn btn-p" onclick="checkBeforePost()">+ Sell</button></div>
<div class="container">
<div id="f" class="form"><h4 id="ft">Post Property</h4><input id="t" placeholder="Title"><select id="ty"><option>Land</option><option>House</option><option>Shop</option><option>Flat</option><option>Farm</option></select><input id="pr" type="number" placeholder="Price ₦"><input id="lo" placeholder="Location"><input id="ph" placeholder="WhatsApp 080..."><textarea id="de" placeholder="Description"></textarea><label style="font-size:12px;font-weight:700;display:block;margin-top:6px">📸 Picture from Gallery - WORKS!</label><input type="file" id="file" accept="image/*" onchange="handleFile(this)"><img id="prev" class="preview"><input id="im" placeholder="Or image link"><input type="hidden" id="eid"><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="saveAd()" id="sb">Post Ad</button><button class="btn btn-g" style="width:100%;margin-top:6px" onclick="tog()">Cancel</button><small id="limitInfo" style="display:block;text-align:center;margin-top:6px;color:#666"></small></div>
<div id="g" class="grid"></div><div id="empty" style="display:none;text-align:center;padding:30px;color:#666">No ads. Be first!</div>
<div style="text-align:center;margin-top:15px"><button class="btn btn-g" onclick="hardReset()" style="font-size:11px">🛠 If blank, tap here to Reset App</button></div>
</div>
<div id="authM" class="modal"><div class="mbox"><div class="tabs"><button id="tabL" class="active" onclick="switchTab('login')">Login</button><button id="tabS" onclick="switchTab('signup')">Sign Up</button></div><div id="loginBox"><h3>Login</h3><input id="l_ph" placeholder="Phone"><input id="l_pass" type="password" placeholder="Password"><input id="l_code" placeholder="Owner code giwm123"><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button></div><div id="signupBox" style="display:none"><h3>Sign Up - Clients Can Register!</h3><input id="s_name" placeholder="Full Name"><input id="s_ph" placeholder="Phone"><input id="s_pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="doSignup()">Create Account</button></div><button class="btn btn-g" style="width:100%;margin-top:8px" onclick="closeM()">Close</button><p id="authMsg" style="color:red;font-size:12px;text-align:center;margin-top:6px"></p></div></div>
<div class="footer">GIWM - 5 FREE ads - Abuja - Owner code giwm123</div>
<script>
// AUTO FIX OLD DATA
let curIm="";
try{
 let raw=localStorage.getItem('giwm_ads'); if(raw && raw.includes('"owner":')){ localStorage.removeItem('giwm_ads'); localStorage.removeItem('giwm_my'); localStorage.removeItem('giwm_admin'); }
}catch(e){ localStorage.clear(); }

let ads=[]; let users=[]; let currentUser=null; let admin=false;
try{ ads=JSON.parse(localStorage.getItem('giwm_ads')||'[]'); users=JSON.parse(localStorage.getItem('giwm_users')||'[]'); currentUser=JSON.parse(localStorage.getItem('giwm_current')||'null'); admin=localStorage.getItem('giwm_admin')==='1'; }catch(e){ ads=[]; users=[]; localStorage.clear(); }

if(!Array.isArray(ads) || ads.length===0){ ads=[{id:'1',title:'Farm Land Kuje 500sqm',ty:'Land',price:1200000,lo:'Kuje, Abuja',ph:'08000000000',de:'Verified land',im:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=500',ownerId:'admin',created:Date.now()}]; }

function persist(){ try{ localStorage.setItem('giwm_ads',JSON.stringify(ads)); localStorage.setItem('giwm_users',JSON.stringify(users)); if(currentUser) localStorage.setItem('giwm_current',JSON.stringify(currentUser)); }catch(e){ alert('Storage full, delete some ads or use smaller images'); } }
function hardReset(){ if(confirm('Reset app? Will delete local posts')){ localStorage.clear(); location.reload(); } }
function handleFile(i){ let f=i.files[0]; if(!f) return; if(f.size>2*1024*1024){ alert('Image >2MB, pick smaller'); return; } let r=new FileReader(); r.onload=e=>{ curIm=e.target.result; let p=document.getElementById('prev'); p.src=curIm; p.style.display='block'; }; r.readAsDataURL(f); }
function checkBeforePost(){ if(!currentUser &&!admin){ openAuth(); document.getElementById('authMsg').innerText='Sign Up first!'; return; } tog(); }
function tog(){ let e=document.getElementById('f'); e.style.display=e.style.display==='block'?'none':'block'; if(e.style.display==='none') resetForm(); else { updateLimit(); window.scrollTo(0,0); } }
function resetForm(){ ['t','pr','lo','ph','de','im','eid'].forEach(id=>{let el=document.getElementById(id); if(el) el.value='';}); curIm=""; let p=document.getElementById('prev'); if(p){p.style.display='none'; p.src='';} let fl=document.getElementById('file'); if(fl) fl.value=''; document.getElementById('ft').innerText='Post Property'; document.getElementById('sb').innerText='Post Ad'; }
function updateLimit(){ let c=0; if(currentUser) c=ads.filter(a=>a.ownerId===currentUser.ph).length; let txt=admin?'Owner Unlimited 👑':currentUser?`${c}/5 used, ${5-c} left`:'Login needed'; document.getElementById('limitInfo').innerText=txt; }
function saveAd(){
 let id=document.getElementById('eid').value; let t=document.getElementById('t').value.trim(); let ty=document.getElementById('ty').value; let pr=parseInt(document.getElementById('pr').value); let lo=document.getElementById('lo').value.trim(); let ph=document.getElementById('ph').value.trim()||(currentUser?currentUser.ph:''); let de=document.getElementById('de').value.trim(); let link=document.getElementById('im').value.trim(); let finalIm=curIm||link||'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500';
 if(!t||!pr||!lo){ alert('Fill Title Price Location'); return; }
 if(id){ let idx=ads.findIndex(a=>a.id===id); if(idx>-1){ if(!admin && ads[idx].ownerId!==currentUser.ph){ alert('Not your ad'); return; } ads[idx]={...ads[idx],title:t,ty,price:pr,lo,ph,de,im:finalIm}; } }
 else{ if(!admin){ if(!currentUser){ openAuth(); return; } if(ads.filter(a=>a.ownerId===currentUser.ph).length>=5){ alert('5 limit reached'); return; } } let nid=Date.now().toString(); ads.unshift({id:nid,title:t,ty,price:pr,lo,ph,de,im:finalIm,ownerId:currentUser?currentUser.ph:'admin',created:Date.now()}); }
 persist(); render(); tog(); resetForm(); alert('✅ Posted!');
}
function editAd(id){ let a=ads.find(x=>x.id===id); if(!a) return; if(!admin && (!currentUser||a.ownerId!==currentUser.ph)){ alert('Not yours'); return; } document.getElementById('f').style.display='block'; document.getElementById('eid').value=a.id; document.getElementById('t').value=a.title; document.getElementById('ty').value=a.ty; document.getElementById('pr').value=a.price; document.getElementById('lo').value=a.lo; document.getElementById('ph').value=a.ph; document.getElementById('de').value=a.de; if(a.im.startsWith('data:')){ curIm=a.im; let p=document.getElementById('prev'); p.src=a.im; p.style.display='block'; } else { document.getElementById('im').value=a.im; } document.getElementById('ft').innerText='Edit'; document.getElementById('sb').innerText='Update'; window.scrollTo(0,0); }
function deleteAd(id){ if(!confirm('Delete?')) return; ads=ads.filter(x=>x.id!==id); persist(); render(); }
function render(){
 try{
  let q=(document.getElementById('q').value||'').toLowerCase(); let g=document.getElementById('g'); let list=ads.filter(a=> (a.title+' '+(a.lo||'')+' '+(a.ty||'')).toLowerCase().includes(q)).sort((a,b)=>(b.created||0)-(a.created||0));
  if(list.length===0){ g.innerHTML=''; document.getElementById('empty').style.display='block'; } else { document.getElementById('empty').style.display='none'; g.innerHTML=list.map(a=>{ let mine=admin||(currentUser&&a.ownerId===currentUser.ph); return `<div class="card">${mine?'<span class="badge">MY AD</span>':''}<img src="${a.im}" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400'"><div class="body"><div class="price">₦${Number(a.price||0).toLocaleString()}</div><div class="title">${a.title||''}</div><div class="loc">${a.ty||''} • ${a.lo||''}</div>${mine?`<div class="acts"><button class="edit" onclick="editAd('${a.id}')">Edit</button><button class="del" onclick="deleteAd('${a.id}')">Delete</button></div>`:''}<a class="wa" href="https://wa.me/234${(a.ph||'').replace(/^0/,'')}" target="_blank">WhatsApp ${a.ph||''}</a></div></div>`; }).join(''); }
  updateHeader();
 }catch(e){ console.log(e); document.getElementById('g').innerHTML='<p style="text-align:center;padding:20px">Error loading. <button onclick="hardReset()">Tap to Reset</button></p>'; }
}
function updateHeader(){ let h=document.getElementById('hUser'); if(currentUser) h.innerHTML=`<span class="userpill">Hi ${currentUser.name.split(' ')[0]} ✅</span><button class="btn btn-g" style="padding:6px 10px;font-size:11px" onclick="logout()">Logout</button>`; else if(admin) h.innerHTML=`<span class="userpill">Owner 👑</span><button class="btn btn-g" style="padding:6px 10px;font-size:11px" onclick="logout()">Logout</button>`; else h.innerHTML=`<button class="btn btn-g" style="padding:6px 10px;font-size:12px" onclick="openAuth()">Login / Sign Up</button>`; }
function openAuth(){ document.getElementById('authM').style.display='flex'; switchTab('login'); }
function closeM(){ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); document.getElementById('authMsg').innerText=''; }
function switchTab(t){ document.getElementById('tabL').classList.toggle('active',t==='login'); document.getElementById('tabS').classList.toggle('active',t==='signup'); document.getElementById('loginBox').style.display=t==='login'?'block':'none'; document.getElementById('signupBox').style.display=t==='signup'?'block':'none'; }
function doSignup(){ let n=document.getElementById('s_name').value.trim(); let ph=document.getElementById('s_ph').value.trim(); let ps=document.getElementById('s_pass').value.trim(); if(!n||!ph||!ps){ document.getElementById('authMsg').innerText='Fill all'; return; } if(users.find(u=>u.ph===ph)){ document.getElementById('authMsg').innerText='Already exists, login'; switchTab('login'); return; } let u={name:n,ph,pass:ps}; users.push(u); currentUser=u; persist(); closeM(); render(); alert('✅ Created!'); }
function doLogin(){ let ph=document.getElementById('l_ph').value.trim(); let ps=document.getElementById('l_pass').value.trim(); let code=document.getElementById('l_code').value.trim(); if(code==='giwm123'){ admin=true; localStorage.setItem('giwm_admin','1'); closeM(); render(); alert('Owner Unlimited!'); return; } let u=users.find(x=>x.ph===ph&&x.pass===ps); if(!u){ document.getElementById('authMsg').innerText='Wrong details, Sign Up first'; return; } currentUser=u; persist(); closeM(); render(); alert('Logged in!'); }
function logout(){ currentUser=null; admin=false; localStorage.removeItem('giwm_current'); localStorage.removeItem('giwm_admin'); render(); }
render();
</script></body></html>

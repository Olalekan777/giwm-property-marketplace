<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GIWM MARKET PLACE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb}.header{background:#0b5ed7;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}.logo{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid #fff}.search{background:#fff;padding:10px;display:flex;gap:8px;position:sticky;top:64px;z-index:9;box-shadow:0 2px 6px rgba(0,0,0,.1)}.search input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer}.btn-p{background:#0b5ed7;color:#fff}.container{padding:12px;max-width:900px;margin:auto}.form{background:#fff;padding:14px;border-radius:12px;display:none;margin-bottom:12px}.form input,.form select,.form textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative}.card img{width:100%;height:160px;object-fit:cover}.body{padding:10px}.price{color:#0b5ed7;font-weight:800}.title{font-weight:600;font-size:14px;margin:3px 0}.loc{font-size:12px;color:#666}.badge{position:absolute;top:8px;left:8px;background:#22c55e;color:#fff;font-size:10px;padding:4px 8px;border-radius:20px}.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;font-size:12px;font-weight:700}.edit{background:#fffbeb;border-color:#f59e0b;color:#b45309}.del{background:#fef2f2;border-color:#ef4444;color:#b91c1c}.wa{background:#0b5ed7;color:#fff;text-align:center;text-decoration:none;display:block;padding:8px;border-radius:8px;font-size:12px;font-weight:700;margin-top:8px}.footer{background:#111827;color:#9ca3af;padding:20px 14px;margin-top:20px;font-size:12px}.footer a{color:#9ca3af}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.mbox{background:#fff;padding:18px;border-radius:12px;width:100%;max-width:360px}</style></head><body><div class="header"><img src="logo.png" class="logo"><div><h3>GIWM MARKET PLACE</h3><small>Abuja's Trusted Property Market</small></div></div><div class="search"><input id="q" placeholder="Search Lugbe, Kuje..." oninput="render()"><button class="btn btn-p" onclick="tog()">+ Sell</button></div><div class="container"><div id="f" class="form"><h4 id="ft">Post Property</h4><input id="t" placeholder="Title"><select id="ty"><option>Land</option><option>House</option><option>Shop</option><option>Flat</option></select><input id="pr" type="number" placeholder="Price"><input id="lo" placeholder="Location"><input id="ph" placeholder="WhatsApp 080..."><textarea id="de" placeholder="Description"></textarea><input id="im" placeholder="Image link optional"><input type="hidden" id="eid"><button class="btn btn-p" style="width:100%;margin-top:6px" onclick="save()" id="sb">Post Ad</button><button class="btn" style="width:100%;margin-top:6px;border:1px solid #ddd" onclick="tog()">Cancel</button></div><div id="g" class="grid"></div></div><div class="footer"><div style="display:flex;justify-content:space-between"><div><b style="color:#fff">GIWM</b><br>5 FREE ads<br>Abuja</div><div><b style="color:#fff">Support</b><br><a href="#" onclick="openL()">Seller Login</a></div></div></div><div id="lm" class="modal"><div class="mbox"><h3>Owner Login</h3><input id="code" placeholder="Enter code" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0"><button class="btn btn-p" style="width:100%" onclick="login()">Login</button><button class="btn" style="width:100%;margin-top:6px;border:1px solid #ddd" onclick="closeM()">Close</button><p id="msg" style="color:red;font-size:12px"></p></div></div><script>let ads=JSON.parse(localStorage.getItem('giwm_ads')||'[]');let my=JSON.parse(localStorage.getItem('giwm_my')||'[]');let admin=localStorage.getItem('giwm_admin')==='1';if(ads.length===0){ads=[{id:'1',title:'Farm Land Kuje 500sqm',ty:'Land',price:1200000,lo:'Kuje, Abuja',ph:'08000000000',de:'Good land',im:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400',owner:false}];save()}function save(){localStorage.setItem('giwm_ads',JSON.stringify(ads));localStorage.setItem('giwm_my',JSON.stringify(my))}function tog(){let e=document.getElementById('f');e.style.display=e.style.display==='block'?'none':'block';if(e.style.display==='none'){res()}}function res(){['t','pr','lo','ph','de','im','eid'].forEach(i=>document.getElementById(i).value='');document.getElementById('ft').innerText='Post Property';document.getElementById('sb').innerText='Post Ad'}function save(){let id=document.getElementById('eid').value;let t=document.getElementById('t').value.trim();let ty=document.getElementById('ty').value;let pr=parseInt(document.getElementById('pr').value);let lo=document.getElementById('lo').value.trim();let ph=document.getElementById('ph').value.trim();let de=document.getElementById('de').value.trim();let im=document.getElementById('im').value.trim()||'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';if(!t||!pr||!lo||!ph){alert('Fill title price location phone');return}if(id){let i=ads.findIndex(a=>a.id===id);if(i>-1){ads[i]={...ads[i],title:t,ty,price:pr,lo,ph,de,im}}}else{if(!admin&&my.length>=5){alert('5 FREE limit');return}let nid=Date.now().toString();ads.unshift({id:nid,title:t,ty,price:pr,lo,ph,de,im,owner:true});my.unshift(nid)}localStorage.setItem('giwm_ads',JSON.stringify(ads));localStorage.setItem('giwm_my',JSON.stringify(my));render();tog();res()}function edit(id){let a=ads.find(x=>x.id===id);if(!a)return;document.getElementById('f').style.display='block';document.getElementById('eid').value=a.id;document.getElementById('t').value=a.title;document.getElementById('ty').value=a.ty;document.getElementById('pr').value=a.price;document.getElementById('lo').value=a.lo;document.getElementById('ph').value=a.ph;document.getElementById('de').value=a.de;document.getElementById('im').value=a.im;document.getElementById('ft').innerText='Edit Ad';document.getElementById('sb').innerText='Update';window.scrollTo(0,0)}function del(id){if(!confirm('Delete?'))return;ads=ads.filter(a=>a.id!==id);my=my.filter(m=>m!==id);localStorage.setItem('giwm_ads',JSON.stringify(ads));localStorage.setItem('giwm_my',JSON.stringify(my));render()}function render(){let q=document.getElementById('q').value.toLowerCase();let g=document.getElementById('g');let f=ads.filter(a=>(a.title+a.lo+a.ty).toLowerCase().includes(q));g.innerHTML=f.map(a=>{let mine=my.includes(a.id);return `<div class="card">${mine?'<span class="badge">MY AD</span>':''}<img src="${a.im}"><div class="body"><div class="price">₦${a.price.toLocaleString()}</div><div class="title">${a.title}</div><div class="loc">${a.ty} • ${a.lo}</div>${mine?`<div class="acts"><button class="edit" onclick="edit('${a.id}')">Edit</button><button class="del" onclick="del('${a.id}')">Delete</button></div>`:`<a class="wa" href="https://wa.me/234${a.ph.replace(/^0/,'')}" target="_blank">WhatsApp</a>`}</div></div>`}).join('')||'<p style="text-align:center;color:#666;padding:20px">No ads</p>'}function openL(){document.getElementById('lm').style.display='flex'}function closeM(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none')}function login(){let c=document.getElementById('code').value.trim();if(c==='giwm123'){localStorage.setItem('giwm_admin','1');admin=true;alert('Owner Unlimited Activated!');closeM();render()}else{document.getElementById('msg').innerText='Wrong code'}}render();</script></body></html>

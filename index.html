<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIWM Property Marketplace</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5}
header{background:#0a2540;color:white;padding:20px;text-align:center}
.container{padding:20px;max-width:900px;margin:auto}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px}
button{background:#0a2540;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;width:100%}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<header>
<h1>GIWM Property Marketplace</h1>
<p>Find, Buy, Sell & Rent Properties</p>
</header>
<div class="container">
<div class="card">
<h2>Welcome! Your App is LIVE 🎉</h2>
<p>Your deployment to Render was successful. This is your marketplace homepage.</p>
<button onclick="alert('Login system coming soon!')">Login / Sign Up</button>
</div>
<div class="card">
<h3>Post a Property</h3>
<input placeholder="Property Title e.g. 3 Bedroom in Abuja">
<input placeholder="Price e.g. 50,000,000">
<textarea placeholder="Description"></textarea>
<button>Post Property (Demo)</button>
</div>
</div>
</body>
</html>

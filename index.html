<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GIWM PROPERTY MARKETPLACE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7a3c">
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7f5;color:#222}
header{background:#0a7a3c;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px}
.btn{background:#fff;color:#0a7a3c;border:none;padding:8px 14px;border-radius:8px;font-weight:700}
.search{padding:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.card img{width:100%;height:180px;object-fit:cover;background:#ddd}
.card .info{padding:12px}
.price{color:#0a7a3c;font-weight:800;font-size:16px}
.install-banner{position:fixed;bottom:16px;left:16px;right:16px;background:#0a7a3c;color:#fff;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>
<header>
<h1>GIWM MARKETPLACE</h1>
<button class="btn" onclick="alert('Post Property coming soon')">+ Post</button>
</header>

<div class="search">
<input type="text" id="searchBox" placeholder="Search Lekki, Ibadan, Lagos...">
</div>

<div class="grid" id="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600"><div class="info"><div class="price">₦45,000,000</div><div>3 Bedroom Duplex - Lekki Phase 1</div><small>Verified • Investment Score 89/100</small></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600"><div class="info"><div class="price">₦28,500,000</div><div>4 Bedroom Bungalow - Ibadan</div><small>New • 30 days ago</small></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600"><div class="info"><div class="price">₦65,000,000</div><div>5 Bedroom Fully Detached - Ajah</div><small>Premium • Escrow Secured</small></div></div>
</div>

<div id="installBanner" class="install-banner" style="display:none">
<span>📲 Install GIWM App on your phone</span>
<button class="btn" id="installBtn">Install</button>
</div>

<script>
// PWA Install
let deferredPrompt;
const banner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e)=>{
 e.preventDefault();
 deferredPrompt = e;
 banner.style.display='flex';
});
installBtn.addEventListener('click', async()=>{
 if(!deferredPrompt) return;
 deferredPrompt.prompt();
 await deferredPrompt.userChoice;
 banner.style.display='none';
 deferredPrompt=null;
});

// Search filter
document.getElementById('searchBox').addEventListener('input', (e)=>{
 const q=e.target.value.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
   c.style.display = c.innerText.toLowerCase().includes(q) ? '' : 'none';
 });
});

// Service Worker
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
